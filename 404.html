<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Santiago Hermosilla</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D0D0B">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0B; --fg:#F2EFE6; --fg-mid:#A8A395; --fg-dim:#6E6A5E;
    --line:#2C2C27; --accent:#2ED88E; --accent-wash:rgba(46,216,142,.10);
    --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
    --f-body:'Inter Tight',ui-sans-serif,system-ui,sans-serif;
    --f-mono:'JetBrains Mono',ui-monospace,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100svh; background:var(--bg); color:var(--fg);
    font-family:var(--f-body);
    display:grid; place-items:center; padding:40px 24px;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  /* la misma retícula que el hero del portfolio */
  .grid{
    position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(to right,  rgba(44,44,39,.55) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(44,44,39,.55) 1px, transparent 1px);
    background-size:90px 90px;
    -webkit-mask-image:radial-gradient(120% 80% at 50% 40%, #000 20%, transparent 78%);
            mask-image:radial-gradient(120% 80% at 50% 40%, #000 20%, transparent 78%);
  }
  .wrap{ position:relative; text-align:center; max-width:660px; }

  .code{
    font-family:var(--f-display); font-weight:800;
    font-size:clamp(7rem,26vw,17rem); line-height:.82;
    letter-spacing:-.05em;
    display:flex; justify-content:center; gap:.02em;
  }
  .code span{ display:inline-block; animation:caer .8s var(--ease) both; }
  .code span:nth-child(2){ color:var(--accent); animation-delay:.09s; }
  .code span:nth-child(3){ animation-delay:.18s; }
  @keyframes caer{ from{ opacity:0; transform:translateY(-30px) rotate(-6deg) } to{ opacity:1; transform:none } }

  .eyebrow{
    font-family:var(--f-mono); font-size:.72rem; letter-spacing:.28em;
    text-transform:uppercase; color:var(--accent);
    margin-bottom:22px;
    animation:subir .7s .3s var(--ease) both;
  }
  .msg{
    font-size:clamp(1rem,2.2vw,1.18rem); color:var(--fg-mid);
    margin:26px auto 0; max-width:44ch; line-height:1.65;
    animation:subir .7s .42s var(--ease) both;
  }
  .msg b{ color:var(--fg); font-weight:500; }
  @keyframes subir{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

  .acts{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:38px;
         animation:subir .7s .54s var(--ease) both; }
  .btn{
    font-family:var(--f-mono); font-size:.74rem; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase;
    padding:14px 26px; border:1px solid var(--fg); border-radius:2px;
    text-decoration:none; display:inline-flex; align-items:center; gap:9px;
    transition:transform .28s var(--ease), box-shadow .28s var(--ease), color .28s, border-color .28s;
  }
  .btn--solid{ background:var(--accent); color:#0D0D0B; border-color:var(--accent); box-shadow:3px 3px 0 var(--line); }
  .btn--solid:hover{ transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--fg); }
  .btn--ghost{ color:var(--fg); border-color:var(--line); }
  .btn--ghost:hover{ color:var(--accent); border-color:var(--accent); transform:translate(-2px,-2px); box-shadow:4px 4px 0 var(--accent); }

  .path{
    margin-top:46px; font-family:var(--f-mono); font-size:.72rem;
    color:var(--fg-dim); word-break:break-all;
    animation:subir .7s .66s var(--ease) both;
  }
  .path i{ color:var(--accent); font-style:normal; }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; }
  }
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>

  <main class="wrap">
    <p class="eyebrow">Error 404</p>

    <h1 class="code" aria-label="404">
      <span>4</span><span>0</span><span>4</span>
    </h1>

    <p class="msg">
      Esta página no existe. Puede que la haya movido, que hayas seguido un link
      viejo, o que <b>simplemente nunca estuvo acá</b>.
    </p>

    <div class="acts">
      <a class="btn btn--solid" href="/">Volver al inicio</a>
      <a class="btn btn--ghost" href="/#projects">Ver proyectos</a>
    </div>

    <p class="path">buscabas: <i id="ruta">—</i></p>
  </main>

  <script>
    document.getElementById('ruta').textContent = location.pathname + location.search;
    console.log('%c404 · pero el portfolio sí existe → santiagohermosilla.com',
                'color:#2ED88E;font-weight:700');
  </script>
</body>
</html>
